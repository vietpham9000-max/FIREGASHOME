[platformio]
src_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  madhephaestus/ESP32Servo
  bblanchon/ArduinoJson@^7.2.1
build_src_filter =
  +<main.cpp>
  +<ArduinoBridge.cpp>
